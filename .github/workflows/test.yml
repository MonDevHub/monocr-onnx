name: CI

# Every job in this file used to end `|| echo "No tests yet"`, on all four
# bindings. That makes the step exit 0 whatever happens, so the workflow could
# not fail and the badge reported nothing. It stayed green through a published
# Python package normalising to [0,1] against a model trained on [-1,1], and
# through all four bindings decoding a 316-class model with a 225-character
# charset.
#
# A suppressed failure is worse than no CI, because no CI does not claim to
# have checked. If a binding has no tests, the honest state is a red build, not
# a green one with an echo in the log.

# No branch filter on push. Restricted to [main], a branch got no CI at all
# until someone opened a pull request, so work sat unverified in exactly the
# window where finding a break is cheapest — and a branch pushed for review
# looked untested because it was. The sibling monorepo runs everything on every
# push for the same reason.
on:
  push:
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd python
          pip install .
          pip install pytest
      - name: Run tests
        run: |
          cd python
          pytest tests/

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        # 24, not the 20 in package.json's `engines.node` floor — GitHub
        # deprecated Node 20 runners on 2025-09-19 and silently substitutes 24
        # regardless of this pin. Kept in step with release-js.yml, which
        # explains this at length.
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The install now comes BEFORE the tests, and the reason it used to come
      # after is worth keeping rather than deleting.
      #
      # The old comment read: "Tests first, and with no dependencies installed.
      # They use a fake session and never run inference, and src/ requires
      # onnxruntime-node and sharp lazily, so the suite is pure logic." That was
      # true and it was a good property — it meant a dependency problem could not
      # be mistaken for a test failure, and a test failure could not be masked by
      # one.
      #
      # Three test files added on 2026-08-27 ended it: preprocess.test.js
      # (5213cbf), polarity.test.js (a970032) and page-rules.test.js (167da6a)
      # each `require('sharp')` at the top level, because a polarity or
      # page-rule fixture is a real PNG and there is no way to encode one
      # without an encoder. On 2026-08-27 main went red with four
      # MODULE_NOT_FOUND failures that were not test failures at all.
      #
      # The lockfile check is not lost by moving it first — it still runs, still
      # uses --frozen-lockfile, and still fails on its own step with its own
      # annotation, so an install problem remains distinguishable from a test
      # problem. What is lost is the proof that the suite needs no native
      # modules, and that proof stopped being true.
      #
      # js/ has pnpm-lock.yaml and no package-lock.json, so `npm install` ignored
      # it, dropped pnpm.onlyBuiltDependencies, and ran onnxruntime-node's
      # network postinstall unsandboxed. That is what failed here on 2026-08-15.
      - name: Install dependencies from the committed lockfile
        uses: pnpm/action-setup@v4
        with:
          # There is no package.json at the repo root — this tree ships four
          # bindings and the JS one lives in js/. Without this, action-setup
          # looks for `packageManager` at the root, finds no manifest and fails.
          package_json_file: js/package.json
      # The runner annotates only "exit code 1" and the log needs admin, so this
      # step's real output was invisible from outside when it began failing on
      # 2026-08-19 against a lockfile that had passed unchanged since 2026-08-16.
      - name: Install from the committed lockfile
        run: |
          set +e
          output="$(cd js && pnpm install --frozen-lockfile 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | tail -30 \
              | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=pnpm install failed::${detail}"
            exit "$status"
          fi
      - name: Run tests
        run: |
          cd js
          node --test test/*.test.js

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Go got a format gate on 2026-08-18 and Rust did not, which left this the
      # only binding whose formatting was ungated. It had drifted by 16 lines.
      - name: cargo fmt
        run: |
          cd rust
          cargo fmt --check
      # Wrapped so the failure is readable without admin on the repository.
      # `cargo test` on this job went red on 2026-08-27 and the reason could not
      # be established from outside: the runner annotates only "Process completed
      # with exit code 1", and GET /actions/jobs/:id/logs answers 403 "Must have
      # admin rights to Repository". The pnpm step in js-test and the publish
      # steps in both release workflows already echo their own output back as an
      # ::error:: for exactly this reason; this job was the one that did not.
      #
      # The annotation worked, and what it showed corrects what used to be written
      # here. This block said "whatever fails here is specific to this job and
      # cannot be reproduced on a Mac". Both halves were wrong.
      #
      # Four tests panic in segmenter.rs:
      #
      #   cannot read the shared tiling fixture at
      #   <manifest>/../../monocr-monorepo/shared/segmentation-fixtures/tiling-cases.json
      #
      # `fixture_path()` resolves a SIBLING REPOSITORY. It passes on a dev machine
      # only because monocr-monorepo happens to be checked out beside this one, and
      # it can never resolve on a runner. Not job-specific, and reproducible
      # anywhere the sibling is absent — which is everywhere except one laptop.
      # It has been red since 2026-08-22 (ae4e9ed), not since the merges of the
      # 27th; the merge only carried it to main.
      #
      # Fixed by checking the fixture out and pointing MONOCR_TILING_FIXTURE at it,
      # not by vendoring a copy. A copy is the exact drift the shared fixture
      # exists to prevent — it is generated from the Python implementation and read
      # by the web, Android and iOS ports too. MonDevHub/monocr is public, so no
      # token is needed. The FIXTURE_ENV escape hatch already existed in
      # segmenter.rs; nothing had ever set it.
      #
      # Separately, and still true: these tests do not run on a macOS dev machine
      # by default. Command Line Tools 21 removed the clang 17 path the linker
      # searches, so `cargo test` fails with `ld: library 'clang_rt.osx' not found`
      # before running anything. The runtime is present under the current version
      # directory:
      #
      #   RUSTFLAGS="-C link-arg=-L/Library/Developer/CommandLineTools/usr/lib/clang/21/lib/darwin" \
      #     cargo test
      #
      # With that set the full suite passes locally (28 lib + 14 doc-tests). That
      # is a real and unrelated issue; it is not why this job was red.
      - name: Fetch the shared segmentation fixture
        uses: actions/checkout@v4
        with:
          repository: MonDevHub/monocr
          path: .fixtures-monorepo
          sparse-checkout: shared/segmentation-fixtures
          sparse-checkout-cone-mode: false
      # All THREE shared fixtures the lib tests read, not just the tiling one. Only
      # `MONOCR_TILING_FIXTURE` was wired when this step was written, and the default
      # for the other two is a path relative to the crate that resolves to a sibling
      # `monocr-monorepo` checkout — which exists on a developer's machine and never
      # on a runner. So `page_rules_match_the_shared_fixture` panicked here for as
      # long as it has existed, and the merge fixture would have joined it. The
      # fixtures are already in the sparse checkout above; they were simply not
      # pointed at.
      - name: Run tests
        env:
          MONOCR_TILING_FIXTURE: ${{ github.workspace }}/.fixtures-monorepo/shared/segmentation-fixtures/tiling-cases.json
          MONOCR_RULE_FIXTURE: ${{ github.workspace }}/.fixtures-monorepo/shared/segmentation-fixtures/rule-cases.json
          MONOCR_MERGE_FIXTURE: ${{ github.workspace }}/.fixtures-monorepo/shared/segmentation-fixtures/merge-cases.json
        run: |
          for f in "$MONOCR_TILING_FIXTURE" "$MONOCR_RULE_FIXTURE" "$MONOCR_MERGE_FIXTURE"; do
            test -f "$f" || {
              echo "::error title=Shared fixture missing::$f was not checked out"
              exit 1
            }
          done
          cd rust
          set +e
          output="$(cargo test 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | grep -iE '^error|^warning: unused|panicked|assertion|cannot find|not found|failures:' \
              | head -30 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=cargo test failed::${detail:-no error-shaped line in cargo output; see the tail below}"
            tail="$(printf '%s\n' "$output" | tail -30 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=cargo test output (tail)::${tail}"
            exit "$status"
          fi

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches go/go.mod, which requires 1.23. This read "1.21" until
          # 2026-08-15, so CI compiled against a toolchain the module rejects.
          go-version: "1.23"
      # Neither of these ran until 2026-08-18, and two files had drifted out of
      # gofmt by the time anyone looked.
      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the gate — the output is.
        run: |
          cd go
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error title=Unformatted Go files::$unformatted"
            exit 1
          fi
          echo "gofmt clean"
      - name: go vet
        run: |
          cd go
          go vet ./...
      - name: Run tests
        run: |
          cd go
          go test ./...

  # The charset ships in four copies, one per binding, and every one of them
  # decodes the model's output indices. They drifted to 225 characters against a
  # 316-class model, so this asserts the property that failure violated: all four
  # are byte-identical, and their length matches the model's class count minus
  # the CTC blank. It needs no toolchain and no network.
  charset-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All four bundled charsets are identical
        run: |
          set -euo pipefail
          for f in js/src/charset.txt go/charset.txt rust/src/charset.txt; do
            cmp python/monocr_onnx/charset.txt "$f"
          done
      - name: The charset keeps its leading space
        # A bare .strip()/.trim() eats U+0020 and shifts every index by one.
        run: |
          set -euo pipefail
          head -c 1 python/monocr_onnx/charset.txt | od -An -tx1 | grep -q '20'

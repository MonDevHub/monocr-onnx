# Publishes the `monocr` Rust crate to crates.io on a `rust/v*` tag.
#
# Named `monocr` on crates.io, not `monocr-onnx` like the repository and the
# other three bindings' registries. Chosen deliberately on 2026-09-03, before
# the first publish, once `monocr` was confirmed unclaimed there. `Cargo.toml`'s
# `[lib] name` stays `monocr_onnx`, so nothing importing this crate needs to
# change; only the published identity differs from the other bindings'.
#
# Trusted publishing (OIDC) via rust-lang/crates-io-auth-action, so there is no
# CARGO_REGISTRY_TOKEN long-lived secret to store, leak or rotate.
#
# ONE-TIME SETUP, and it must happen in this order: crates.io has no
# "pending publisher" mechanism (unlike PyPI's, which lets you register a
# publisher before a project's first release). A crates.io Trusted Publisher
# Configuration can only be attached to a crate that already exists.
#   1. Publish an initial version manually once, with a personal API token:
#        cd rust && cargo login && cargo publish
#   2. Only after that, on the crate's settings page at
#        https://crates.io/crates/monocr/settings
#      add a GitHub Actions trusted publisher:
#        Repository owner: MonDevHub
#        Repository name:  monocr-onnx
#        Workflow filename: release-rust.yml
#        Environment: (blank)
#   Before step 2 is done, this workflow's OIDC token exchange is refused by
#   crates.io — there is no configuration for it to match against yet.
#   Reference: https://crates.io/docs/trusted-publishing and RFC 3691
#   (rust-lang/rfcs, text/3691-trusted-publishing-cratesio.md), which lists a
#   PENDING pre-registration state under "Future possibilities" — i.e. not
#   implemented as of this writing.
#
# The tag is namespaced `rust/v*` because this repository ships four bindings
# from one tree: go/v*, js/v* and python/v* already claim the others. A bare
# `v*` would be ambiguous about which binding is being released.
#
# THE TESTS RUN BEFORE THE PUBLISH. The sibling `janakhpon/monocr` repository
# — a different codebase, unrelated to this crate sharing its published name —
# had a release workflow that built and published without running anything,
# which is how a decoder that mapped every index to the wrong character
# reached PyPI and sat there for three releases.
name: release-rust

on:
  push:
    tags:
      - "rust/v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to a commit rather than the `stable` branch, because this job
      # holds `id-token: write` and can therefore mint a crates.io publish token.
      # A mutable ref there means whoever moves the branch chooses what runs in a
      # job that can publish under our name. Every other action in this file was
      # already commit-pinned; this was the one that was not.
      #
      # `toolchain` is now stated explicitly so the pin freezes the ACTION and not
      # the Rust version. This action selects its toolchain from the `toolchain`
      # input, whose default is set per branch — `stable` on this branch — so a
      # bare commit pin would keep working today and silently mean something else
      # if the pin were ever moved to another branch's commit.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-03
        with:
          toolchain: stable
          components: rustfmt

      # A tag that disagrees with Cargo.toml publishes the wrong number under
      # the right name, and crates.io has no undo — even a yanked version
      # keeps its slot forever.
      - name: Verify the tag matches Cargo.toml
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#rust/v}"
          PKG="$(awk -F'"' '/^version = /{print $2; exit}' rust/Cargo.toml)"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error title=Tag/version mismatch::tag rust/v$TAG does not match Cargo.toml version $PKG"
            exit 1
          fi
          echo "tag and Cargo.toml agree on $PKG"

      # Mirrors the rust-test job in test.yml: fmt, then test with the shared
      # fixtures checked out. That job does not run clippy, so this gate does not
      # invent one either — a release check that verifies something CI never
      # verifies is not mirroring CI, it is a second, divergent policy.
      #
      # This block said it mirrored that job while running a bare `cargo test`.
      # It did not, and the difference is the whole reason the first tag this
      # workflow ever ran on failed: three lib tests read fixtures from a SIBLING
      # monocr-monorepo checkout, which exists on a developer machine and never on
      # a runner, so `cargo test` exits 101 before the publish step is reached.
      # The tag/version gate above passed, fmt passed, and the release still could
      # not happen.
      - name: cargo fmt
        run: |
          cd rust
          cargo fmt --check

      - name: Fetch the shared segmentation fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MonDevHub/monocr
          ref: dc5c8ae34303152dce7ce6552398b1307475fd40
          path: .fixtures-monorepo
          sparse-checkout: shared/segmentation-fixtures
          sparse-checkout-cone-mode: false

      - name: Run tests
        env:
          MONOCR_TILING_FIXTURE: ${{ github.workspace }}/.fixtures-monorepo/shared/segmentation-fixtures/tiling-cases.json
          MONOCR_RULE_FIXTURE: ${{ github.workspace }}/.fixtures-monorepo/shared/segmentation-fixtures/rule-cases.json
          MONOCR_MERGE_FIXTURE: ${{ github.workspace }}/.fixtures-monorepo/shared/segmentation-fixtures/merge-cases.json
        run: |
          for f in "$MONOCR_TILING_FIXTURE" "$MONOCR_RULE_FIXTURE" "$MONOCR_MERGE_FIXTURE"; do
            test -f "$f" || {
              echo "::error title=Shared fixture missing::$f was not checked out"
              exit 1
            }
          done
          cd rust
          set +e
          output="$(cargo test 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | grep -iE '^error|panicked|assertion|cannot find|not found|failures:' \
              | head -30 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=cargo test failed::${detail:-no error-shaped line; see the tail below}"
            tail="$(printf '%s\n' "$output" | tail -30 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=cargo test output (tail)::${tail}"
            exit "$status"
          fi

      # Exchanges this job's GitHub OIDC identity for a short-lived crates.io
      # token. Requires `id-token: write` above and a Trusted Publisher
      # Configuration already set up on crates.io (see the header comment).
      # The action's own `post` step revokes the token when the job ends.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: |
          cd rust
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

[package]
name = "monocr"
version = "0.3.1"
edition = "2021"
description = "On-device Mon (mnw) OCR, powered by ONNX Runtime"
license = "MIT"
authors = ["Janakh"]
repository = "https://github.com/MonDevHub/monocr-onnx"
homepage = "https://github.com/MonDevHub/monocr-onnx/tree/main/rust"
documentation = "https://docs.rs/monocr"

[[bin]]
name = "monocr"
path = "src/main.rs"

[lib]
name = "monocr_onnx"
path = "src/lib.rs"

[dependencies]
# Pinned exactly, not by range. `ort` is a pre-release, and the caret range
# "2.0.0-rc.11" admits rc.13, which changed `ort::Error`'s Send/Sync bounds and
# does not compile here. The bundled Cargo.lock hides this locally — consumers
# ignore it — so 0.3.0 shipped uncompilable for every downstream user.
ort = "=2.0.0-rc.11"
image = "0.24"
ndarray = "0.17"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
indicatif = "0.17"
dirs = "5.0"
tempfile = "3.8"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

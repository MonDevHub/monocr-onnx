[package]
name = "monocr"
version = "0.3.1"
edition = "2021"
description = "Universal MonOCR package with ONNX bindings for Rust"
license = "MIT"
authors = ["Janakh"]
repository = "https://github.com/MonDevHub/monocr-onnx"
homepage = "https://github.com/MonDevHub/monocr-onnx/tree/main/rust"
documentation = "https://docs.rs/monocr"

[[bin]]
name = "monocr"
path = "src/main.rs"

[lib]
name = "monocr_onnx"
path = "src/lib.rs"

[dependencies]
# Pinned exactly, not by range. `ort` is a pre-release, and Cargo's
# pre-release ordering lets the caret range "2.0.0-rc.11" admit rc.13 —
# which changed `ort::Error`'s Send/Sync bounds and does not compile against
# this crate. The bundled Cargo.lock pins rc.11, so local builds, CI and
# docs.rs were all green while every downstream `cargo add monocr` resolved
# forward to rc.13 and failed with nine E0277s. A dependency's lockfile is
# ignored by consumers.
#
# 0.3.0 shipped with the range and is broken for exactly that reason. The
# sibling CLI at monocr-monorepo/apps/cli already carried this fix and the
# comment explaining it; this crate never applied it.
ort = "=2.0.0-rc.11"
image = "0.24"
ndarray = "0.17"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
tokio = { version = "1", features = ["full"] }
indicatif = "0.17"
dirs = "5.0"
tempfile = "3.8"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
